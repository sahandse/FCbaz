name: fcbaz
description: FCBaz - Persian FC27 companion for Android
publish_to: "none"
version: 2.6.0+48

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1
  workmanager: ^0.10.10
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
  assets:
    - assets/icon/fcbaz_app_icon.png
    - assets/data/
    - assets/fonts/OFL.txt
    - assets/fonts/Vazirmatn-OFL.txt

flutter_launcher_icons:
  android: true
  image_path: assets/icon/fcbaz_app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#050806"
  adaptive_icon_foreground: assets/icon/fcbaz_app_icon.png
  remove_alpha_ios: true
