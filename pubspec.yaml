name: fcbaz
description: FCBaz - Persian FC27 companion for Android
publish_to: "none"
version: 0.21.0+21

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/fcbaz_app_icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/icon/fcbaz_app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#080B0F"
  adaptive_icon_foreground: assets/icon/fcbaz_app_icon.png
  remove_alpha_ios: true
