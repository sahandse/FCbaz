name: FCBaz Android Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE_VERSION: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production config
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FCBAZ_API_BASE_URL: ${{ secrets.FCBAZ_API_BASE_URL }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$FIREBASE_API_KEY" || (echo "Missing FIREBASE_API_KEY" && exit 1)
          test -n "$FIREBASE_APP_ID" || (echo "Missing FIREBASE_APP_ID" && exit 1)
          test -n "$FIREBASE_MESSAGING_SENDER_ID" || (echo "Missing FIREBASE_MESSAGING_SENDER_ID" && exit 1)
          test -n "$FIREBASE_PROJECT_ID" || (echo "Missing FIREBASE_PROJECT_ID" && exit 1)
          test -n "$FCBAZ_API_BASE_URL" || (echo "Missing FCBAZ_API_BASE_URL" && exit 1)
          case "$FCBAZ_API_BASE_URL" in
            https://*) ;;
            *) echo "FCBAZ_API_BASE_URL must use HTTPS" && exit 1 ;;
          esac

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org ir.fcbaz --project-name fcbaz

      - name: Set Android identity
        shell: bash
        run: |
          sed -i 's/applicationId = "ir.fcbaz.fcbaz"/applicationId = "ir.fcbaz.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = "ir.fcbaz.fcbaz"/namespace = "ir.fcbaz.app"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="fcbaz"/android:label="FCBaz"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/package ir.fcbaz.fcbaz/package ir.fcbaz.app/' android/app/src/main/kotlin/ir/fcbaz/fcbaz/MainActivity.kt || true
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/fcbaz-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fcbaz-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s

          anchor = 'android {'
          setup = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          s = s.replace(anchor, setup + anchor, 1)

          signing_anchor = 'buildTypes {'
          signing = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              '''
          s = s.replace(signing_anchor, signing + signing_anchor, 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          p.write_text(s)
          PY

      - name: Set release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = "${{ env.RELEASE_VERSION }}"
          p = Path("pubspec.yaml")
          lines = p.read_text().splitlines()
          out = []
          changed = False
          for line in lines:
              if line.startswith("version:"):
                  out.append("version: " + version + "+${{ github.run_number }}")
                  changed = True
              else:
                  out.append(line)
          if not changed:
              raise SystemExit("pubspec version field not found")
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        env:
          API_BASE: ${{ secrets.FCBAZ_API_BASE_URL }}
        run: >
          flutter build apk --release
          --dart-define=FCBAZ_API_BASE_URL=$API_BASE
          --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Build signed release AAB
        env:
          API_BASE: ${{ secrets.FCBAZ_API_BASE_URL }}
        run: >
          flutter build appbundle --release
          --dart-define=FCBAZ_API_BASE_URL=$API_BASE
          --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Prepare release files
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "FCBaz-v${{ env.RELEASE_VERSION }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "FCBaz-v${{ env.RELEASE_VERSION }}.aab"
          sha256sum "FCBaz-v${{ env.RELEASE_VERSION }}.apk" "FCBaz-v${{ env.RELEASE_VERSION }}.aab" > SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-release
          path: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: FCBaz v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
