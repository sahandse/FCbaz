name: FCBaz Android Production Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without v prefix
        required: true
        default: 2.6.1
        type: string
      build_number:
        description: Android versionCode (must be greater than the previous 48)
        required: true
        default: '49'
        type: string
      api_base_url:
        description: Optional production FCBaz API base URL; leave empty for verified public data path
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - '.release/fcbaz-v2.6.1'

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '2.6.1' }}
  RELEASE_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '49' }}
  FCBAZ_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || '' }}
  EXPECTED_CERT_SHA256: 244aab755d0c8c45fe54d9b999aadd36f1e56bce099cd52232b64871d21a0b94

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_version must be X.Y.Z"; exit 1; }
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must be numeric"; exit 1; }
          [ "$RELEASE_BUILD_NUMBER" -ge 49 ] || { echo "build_number must be 49 or newer"; exit 1; }
          if git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}" | grep -q .; then
            echo "Tag v${RELEASE_VERSION} already exists; choose a new release_version instead of overwriting it"
            exit 1
          fi
          if [ -n "$FCBAZ_API_BASE_URL" ] && [[ ! "$FCBAZ_API_BASE_URL" =~ ^https:// ]]; then
            echo "Production API URL must use HTTPS when configured"
            exit 1
          fi

      - name: Configure Android identity, notification icon and stable signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FCBAZ_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.FCBAZ_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.FCBAZ_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.FCBAZ_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/kotlin/ir/fcbaz/app
          cat > android/app/src/main/kotlin/ir/fcbaz/app/MainActivity.kt <<'EOF'
          package ir.fcbaz.app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity : FlutterActivity()
          EOF
          rm -rf android/app/src/main/kotlin/ir/fcbaz/fcbaz || true
          sed -i 's/android:label="fcbaz"/android:label="FCBaz"/' android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_fcbaz.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M3,5h18v14H3zM5,7v10h14V7zM11,7h2v10h-2zM6.5,12a1.5,1.5 0,1 0,3 0a1.5,1.5 0,1 0,-3 0M14.5,12a1.5,1.5 0,1 0,3 0a1.5,1.5 0,1 0,-3 0" />
          </vector>
          EOF
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/fcbaz-release.jks
            STORE_PASSWORD="$STORE_PASSWORD_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
            KEY_ALIAS="$KEY_ALIAS_SECRET"
          else
            mkdir -p /tmp/fcbaz-signing
            ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | contains("signing-backup")) | select(.expired==false) | .id' | head -n 1)
            test -n "$ARTIFACT_ID" || { echo "No non-expired existing signing backup found."; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/fcbaz-signing/signing.zip
            unzip -q -o /tmp/fcbaz-signing/signing.zip -d /tmp/fcbaz-signing
            JKS=$(find /tmp/fcbaz-signing -name 'fcbaz-release.jks' | head -n 1)
            INFO=$(find /tmp/fcbaz-signing -name 'signing-key-info.txt' | head -n 1)
            cp "$JKS" android/app/fcbaz-release.jks
            STORE_PASSWORD=$(awk -F= '/^storePassword=/{print $2}' "$INFO")
            KEY_PASSWORD=$(awk -F= '/^keyPassword=/{print $2}' "$INFO")
            KEY_ALIAS=$(awk -F= '/^keyAlias=/{print $2}' "$INFO")
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fcbaz-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "ir.fcbaz.fcbaz"', 'applicationId = "ir.fcbaz.app"')
          s = s.replace('namespace = "ir.fcbaz.fcbaz"', 'namespace = "ir.fcbaz.app"')
          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          if 'val keystoreProperties = Properties()' not in s:
              s = s.replace('android {', 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\nandroid {', 1)
          if 'create("release")' not in s:
              s = s.replace('    buildTypes {', '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
          keytool -list -keystore android/app/fcbaz-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          # Guard the project-specific Android identity.
          grep -q 'applicationId = "ir.fcbaz.app"' android/app/build.gradle.kts
          grep -q 'namespace = "ir.fcbaz.app"' android/app/build.gradle.kts
          grep -q 'android:label="FCBaz"' android/app/src/main/AndroidManifest.xml
          grep -q 'package ir.fcbaz.app' android/app/src/main/kotlin/ir/fcbaz/app/MainActivity.kt
          test -f android/app/src/main/res/drawable/fcbaz_launcher.xml

      - name: Set release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ['RELEASE_VERSION']
          build = os.environ['RELEASE_BUILD_NUMBER']
          p = Path('pubspec.yaml')
          lines = p.read_text().splitlines()
          p.write_text('\n'.join(f'version: {version}+{build}' if line.startswith('version:') else line for line in lines) + '\n')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon with validated fallback
        shell: bash
        run: |
          set -euo pipefail
          if dart run flutter_launcher_icons; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii
          w = h = 1024
          bg = (8, 11, 15)
          green = (200, 255, 66)
          rows = []
          cx = cy = 512
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  dx = x-cx; dy = y-cy; r2 = dx*dx + dy*dy
                  color = green if 300*300 <= r2 <= 350*350 else bg
                  row.extend(color)
              rows.append(bytes(row))
          def chunk(kind,payload):
              return struct.pack('>I',len(payload))+kind+payload+struct.pack('>I',binascii.crc32(kind+payload)&0xffffffff)
          raw=b''.join(rows)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          Path('assets/icon/fcbaz_app_icon.png').write_bytes(png)
          PY
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }} --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Build signed release AAB
        run: flutter build appbundle --release --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }} --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Prepare and verify release files
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "FCBaz-v${RELEASE_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "FCBaz-v${RELEASE_VERSION}.aab"
          sha256sum "FCBaz-v${RELEASE_VERSION}.apk" "FCBaz-v${RELEASE_VERSION}.aab" > SHA256SUMS.txt
          read -r PLAYERS PS_COUNT PC_COUNT STYLES PLUS SBCS OBJECTIVES EVOLUTIONS NEWS PRICE_UPDATED < <(python3 - <<'PY'
          import json
          catalog = json.load(open('data/live/catalog.json', encoding='utf-8'))
          players = catalog.get('players') or []
          def count(key):
              return sum(1 for p in players if int(p.get(key) or 0) > 0)
          styles = sum(1 for p in players if p.get('playstyles'))
          plus = sum(1 for p in players if p.get('playstyles_plus'))
          print(
              len(players), count('price_ps'), count('price_pc'), styles, plus,
              len(catalog.get('sbcs') or []), len(catalog.get('objectives') or []),
              len(catalog.get('evolutions') or []), len(catalog.get('news') or []),
              catalog.get('price_updated_at') or 'نامشخص',
          )
          PY
          )
          cat > RELEASE_NOTES.md <<EOF
          ## FCBaz v${RELEASE_VERSION}

          - کاتالوگ FC27 با ${PLAYERS} کارت بازیکن از اسنپ‌شات رسمی EA/FUT.GG همگام شد؛ پست اصلی و پست‌های جایگزین، قد، پای تخصصی، Skill Move و Weak Foot از منبع اصلی حفظ می‌شوند.
          - PlayStyle برای ${STYLES} کارت و PlayStyle+ برای ${PLUS} کارت از فید FC27 بازیابی شد؛ آمار داخل بازی و آمار دروازه‌بان‌ها (DIV/HAN/KIC/REF/SPD/POS) از همان منبع خوانده می‌شود.
          - قیمت PS برای ${PS_COUNT} کارت و قیمت PC برای ${PC_COUNT} کارت جداگانه نگهداری می‌شود؛ هیچ تبدیل ارز یا برآورد قیمتی انجام نمی‌شود و قیمت صفر/ناموجود به‌صورت «—» نمایش داده می‌شود.
          - مهر زمانی آخرین اسنپ‌شات تأییدشده قیمت: ${PRICE_UPDATED}. در نبود شبکه، آخرین کاتالوگ سالم از کش خوانده می‌شود و منبع/زمان آن در صفحه «تازگی قیمت‌ها» قابل بررسی است.
          - تصویر بازیکن فقط از آدرس‌های تأییدشده EA و هاب FC27 خوانده می‌شود؛ برای کارت بدون تصویر، سیلوئت نمایش داده می‌شود و هیچ URL حدسی یا عکس بازیکن دیگر استفاده نمی‌شود.
          - ${SBCS} SBC، ${OBJECTIVES} Objective و ${EVOLUTIONS} Evolution از منابع عمومی FUT.GG؛ ${NEWS} خبر FC27 به فارسی. داده ساختگی ساخته نمی‌شود و FC26 فیلتر می‌شود.
          - مسیر انتشار debug-signed حذف شد؛ فقط همین workflow با keystore پایدار مجوز انتشار GitHub Release دارد و قبل از انتشار، امضا، package، versionCode/versionName، نام FCBaz و آیکون سفارشی بررسی می‌شوند.
          - پلتفرم اندروید اکنون در مخزن نگهداری می‌شود و CI دیگر با flutter create تنظیمات پروژه را بازنویسی نمی‌کند؛ اثر انگشت گواهی پایدار و هویت بسته پیش و پس از انتشار به‌صورت خودکار بررسی می‌شوند.
          - کارت‌های بازیکن با طراحی FC27، قیمت PS/PC جدا، نشان PlayStyle+ و کارت رسمی EA؛ هاب خانه، جستجو، فیلترها، SBC، Objectives، Evolutions و اخبار از کاتالوگ زنده تغذیه می‌شوند.
          - سازگاری نصب: Android 7.0 (API 24) و بالاتر. نسخه v2.5.0 با امضای debug منتشر شده بود؛ اگر آن را نصب کرده‌اید، برای نصب این نسخه امضاشده باید نسخه قبلی را حذف کنید. ارتقای مستقیم از v2.3.2 و نسخه‌های با امضای پایدار حفظ می‌شود.
          EOF

          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "FCBaz-v${RELEASE_VERSION}.apk" | tee apk-signature.txt
          grep -q "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" apk-signature.txt
          grep -qE 'certificate (DN|subject DN): .*CN=FCBaz' apk-signature.txt
          grep -qE 'certificate (DN|subject DN): .*O=FCBaz' apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          badging="$("$build_tools/aapt2" dump badging "FCBaz-v${RELEASE_VERSION}.apk")"
          echo "$badging" | grep -q "package: name='ir.fcbaz.app'"
          echo "$badging" | grep -q "versionCode='${RELEASE_BUILD_NUMBER}'"
          echo "$badging" | grep -q "versionName='${RELEASE_VERSION}'"
          echo "$badging" | grep -q "application-label:'FCBaz'"
          echo "$badging" | grep -q "launchable-activity: name='ir.fcbaz.app.MainActivity'"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-release
          path: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
            RELEASE_NOTES.md
            apk-signature.txt
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: FCBaz v${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
            apk-signature.txt

      - name: Verify the published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "v${RELEASE_VERSION}" --dir published --clobber
          cd published
          sha256sum -c SHA256SUMS.txt
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "FCBaz-v${RELEASE_VERSION}.apk" | tee published-apk-signature.txt
          grep -q "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" published-apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" published-apk-signature.txt
