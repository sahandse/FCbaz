name: FCBaz Android Production Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without v prefix
        required: true
        default: 1.1.1
        type: string
      api_base_url:
        description: Optional production FCBaz API base URL; leave empty for verified public data path
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - '.release/fcbaz-v1.1.1'

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '1.1.1' }}
  RELEASE_BUILD_NUMBER: ${{ github.run_number }}
  FCBAZ_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_version must be X.Y.Z"; exit 1; }
          if [ -n "$FCBAZ_API_BASE_URL" ] && [[ ! "$FCBAZ_API_BASE_URL" =~ ^https:// ]]; then
            echo "Production API URL must use HTTPS when configured"
            exit 1
          fi

      - name: Complete Android platform
        run: flutter create . --platforms=android --org ir.fcbaz --project-name fcbaz

      - name: Configure Android identity, notification icon and stable signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FCBAZ_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.FCBAZ_STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.FCBAZ_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.FCBAZ_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/kotlin/ir/fcbaz/app
          cat > android/app/src/main/kotlin/ir/fcbaz/app/MainActivity.kt <<'EOF'
          package ir.fcbaz.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          rm -rf android/app/src/main/kotlin/ir/fcbaz/fcbaz || true
          sed -i 's/android:label="fcbaz"/android:label="FCBaz"/' android/app/src/main/AndroidManifest.xml || true

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_fcbaz.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M3,5h18v14H3zM5,7v10h14V7zM11,7h2v10h-2zM6.5,12a1.5,1.5 0,1 0,3 0a1.5,1.5 0,1 0,-3 0M14.5,12a1.5,1.5 0,1 0,3 0a1.5,1.5 0,1 0,-3 0" />
          </vector>
          EOF

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/fcbaz-release.jks
            STORE_PASSWORD="$STORE_PASSWORD_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
            KEY_ALIAS="$KEY_ALIAS_SECRET"
          else
            mkdir -p /tmp/fcbaz-signing
            ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | contains("signing-backup")) | select(.expired==false) | .id' \
              | head -n 1)
            test -n "$ARTIFACT_ID" || { echo "No non-expired existing signing backup found."; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/fcbaz-signing/signing.zip
            unzip -q -o /tmp/fcbaz-signing/signing.zip -d /tmp/fcbaz-signing
            JKS=$(find /tmp/fcbaz-signing -name 'fcbaz-release.jks' | head -n 1)
            INFO=$(find /tmp/fcbaz-signing -name 'signing-key-info.txt' | head -n 1)
            cp "$JKS" android/app/fcbaz-release.jks
            STORE_PASSWORD=$(awk -F= '/^storePassword=/{print $2}' "$INFO")
            KEY_PASSWORD=$(awk -F= '/^keyPassword=/{print $2}' "$INFO")
            KEY_ALIAS=$(awk -F= '/^keyAlias=/{print $2}' "$INFO")
          fi

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fcbaz-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "ir.fcbaz.fcbaz"', 'applicationId = "ir.fcbaz.app"')
          s = s.replace('namespace = "ir.fcbaz.fcbaz"', 'namespace = "ir.fcbaz.app"')
          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          if 'val keystoreProperties = Properties()' not in s:
              s = s.replace('android {', 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\nandroid {', 1)
          if 'create("release")' not in s:
              s = s.replace('    buildTypes {', '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
          keytool -list -keystore android/app/fcbaz-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Set release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ['RELEASE_VERSION']
          build = os.environ['RELEASE_BUILD_NUMBER']
          p = Path('pubspec.yaml')
          lines = p.read_text().splitlines()
          p.write_text('\n'.join(f'version: {version}+{build}' if line.startswith('version:') else line for line in lines) + '\n')
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon with validated fallback
        shell: bash
        run: |
          set -euo pipefail
          if dart run flutter_launcher_icons; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii
          w = h = 1024
          bg = (8, 11, 15)
          green = (102, 240, 138)
          rows = []
          cx = cy = 512
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  dx = x - cx; dy = y - cy; r2 = dx*dx + dy*dy
                  color = green if 300*300 <= r2 <= 350*350 else bg
                  row.extend(color)
              rows.append(bytes(row))
          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', binascii.crc32(kind + payload) & 0xffffffff)
          raw = b''.join(rows)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w,h,8,2,0,0,0)) + chunk(b'IDAT', zlib.compress(raw,9)) + chunk(b'IEND', b'')
          Path('assets/icon/fcbaz_app_icon.png').write_bytes(png)
          PY
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }} --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Build signed release AAB
        run: flutter build appbundle --release --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }} --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Prepare and verify release files
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "FCBaz-v${RELEASE_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "FCBaz-v${RELEASE_VERSION}.aab"
          sha256sum "FCBaz-v${RELEASE_VERSION}.apk" "FCBaz-v${RELEASE_VERSION}.aab" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          ## FCBaz v${RELEASE_VERSION}

          Hotfix صفحه سیاه هنگام شروع برنامه.

          - UI قبل از initialize سرویس‌های اختیاری Android نمایش داده می‌شود.
          - خطای Notification یا WorkManager دیگر startup را متوقف نمی‌کند.
          - resource واقعی ic_stat_fcbaz در APK قرار می‌گیرد.
          - لود تنظیمات و Price Alert هنگام شروع fail-safe شده است.
          - داده ساختگی نمایش داده نمی‌شود.
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-release
          path: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
            RELEASE_NOTES.md
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: FCBaz v${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
