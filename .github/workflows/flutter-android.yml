name: FCBaz Android Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix, e.g. 1.0.0
        required: true
        type: string
      api_base_url:
        description: Production FCBaz API base URL
        required: true
        type: string
      publish_release:
        description: Publish GitHub Release after successful build
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org ir.fcbaz --project-name fcbaz

      - name: Set Android identity
        shell: bash
        run: |
          sed -i 's/applicationId = "ir.fcbaz.fcbaz"/applicationId = "ir.fcbaz.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = "ir.fcbaz.fcbaz"/namespace = "ir.fcbaz.app"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="fcbaz"/android:label="FCBaz"/' android/app/src/main/AndroidManifest.xml

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/fcbaz-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fcbaz-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s

          anchor = 'android {'
          setup = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          s = s.replace(anchor, setup + anchor, 1)

          signing_anchor = 'buildTypes {'
          signing = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              '''
          s = s.replace(signing_anchor, signing + signing_anchor, 1)

          debug_line = 'signingConfig = signingConfigs.getByName("debug")'
          release_line = 'signingConfig = signingConfigs.getByName("release")'
          s = s.replace(debug_line, release_line)

          p.write_text(s)
          PY

      - name: Set release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = "${{ inputs.version }}"
          p = Path("pubspec.yaml")
          s = p.read_text().splitlines()
          out = []
          changed = False
          for line in s:
              if line.startswith("version:"):
                  out.append("version: " + version + "+${{ github.run_number }}")
                  changed = True
              else:
                  out.append(line)
          if not changed:
              raise SystemExit("pubspec version field not found")
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: >
          flutter build apk --release
          --dart-define=FCBAZ_API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=FCBAZ_APP_VERSION=${{ inputs.version }}

      - name: Build signed release AAB
        run: >
          flutter build appbundle --release
          --dart-define=FCBAZ_API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=FCBAZ_APP_VERSION=${{ inputs.version }}

      - name: Prepare release files
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "FCBaz-v${{ inputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "FCBaz-v${{ inputs.version }}.aab"
          sha256sum "FCBaz-v${{ inputs.version }}.apk" "FCBaz-v${{ inputs.version }}.aab" > SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ inputs.version }}-release
          path: |
            FCBaz-v${{ inputs.version }}.apk
            FCBaz-v${{ inputs.version }}.aab
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FCBaz v${{ inputs.version }}
          generate_release_notes: true
          files: |
            FCBaz-v${{ inputs.version }}.apk
            FCBaz-v${{ inputs.version }}.aab
            SHA256SUMS.txt
