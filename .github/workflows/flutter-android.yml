name: FCBaz Android Final Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE_VERSION: "1.0.1"
  FCBAZ_API_BASE_URL: "https://selfreliant-welcome-clients--sahandrezvanaza.replit.app"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org ir.fcbaz --project-name fcbaz

      - name: Set Android identity
        shell: bash
        run: |
          sed -i 's/applicationId = "ir.fcbaz.fcbaz"/applicationId = "ir.fcbaz.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = "ir.fcbaz.fcbaz"/namespace = "ir.fcbaz.app"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="fcbaz"/android:label="FCBaz"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/package ir.fcbaz.fcbaz/package ir.fcbaz.app/' android/app/src/main/kotlin/ir/fcbaz/fcbaz/MainActivity.kt || true
          if ! grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Generate persistent release signing material for this release
        shell: bash
        run: |
          STORE_PASSWORD=$(openssl rand -hex 16)
          KEY_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS=fcbaz
          keytool -genkeypair -v             -keystore android/app/fcbaz-release.jks             -alias "$KEY_ALIAS"             -keyalg RSA -keysize 2048 -validity 10000             -storepass "$STORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -dname "CN=FCBaz, OU=Android, O=FCBaz, L=Tehran, ST=Tehran, C=IR"

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fcbaz-release.jks
          EOF

          {
            echo "IMPORTANT: Keep this file and fcbaz-release.jks private."
            echo "Future Android updates must use the same keystore."
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > signing-key-info.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s

          anchor = 'android {'
          setup = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          s = s.replace(anchor, setup + anchor, 1)

          signing_anchor = 'buildTypes {'
          signing = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              '''
          s = s.replace(signing_anchor, signing + signing_anchor, 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          p.write_text(s)
          PY

      - name: Set release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = "${{ env.RELEASE_VERSION }}"
          p = Path("pubspec.yaml")
          lines = p.read_text().splitlines()
          out = []
          changed = False
          for line in lines:
              if line.startswith("version:"):
                  out.append("version: " + version + "+${{ github.run_number }}")
                  changed = True
              else:
                  out.append(line)
          if not changed:
              raise SystemExit("pubspec version field not found")
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Repair launcher icon asset
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          w = h = 512
          bg = (8, 11, 14)
          green = (28, 255, 150)
          white = (235, 245, 240)

          pixels = [[bg for _ in range(w)] for _ in range(h)]

          def rect(x0, y0, x1, y1, color):
              for y in range(max(0,y0), min(h,y1)):
                  row = pixels[y]
                  for x in range(max(0,x0), min(w,x1)):
                      row[x] = color

          # Minimal FCBaz monogram: stylized F + C + B blocks.
          rect(95, 110, 135, 400, green)
          rect(95, 110, 245, 150, green)
          rect(95, 235, 220, 275, green)

          rect(265, 110, 305, 400, white)
          rect(265, 110, 390, 150, white)
          rect(265, 235, 380, 275, white)
          rect(265, 360, 390, 400, white)
          rect(350, 150, 390, 235, white)
          rect(350, 275, 390, 360, white)

          raw = b''.join(b'\x00' + bytes([v for rgb in row for v in rgb]) for row in pixels)

          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)

          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')

          path = Path('assets/icon/fcbaz_app_icon.png')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(png)
          print(f'Wrote valid PNG: {path} ({len(png)} bytes)')
          PY

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: >
          flutter build apk --release
          --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }}
          --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Build signed release AAB
        run: >
          flutter build appbundle --release
          --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }}
          --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Prepare release files
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "FCBaz-v${{ env.RELEASE_VERSION }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "FCBaz-v${{ env.RELEASE_VERSION }}.aab"
          sha256sum "FCBaz-v${{ env.RELEASE_VERSION }}.apk" "FCBaz-v${{ env.RELEASE_VERSION }}.aab" > SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-release
          path: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload signing backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-signing-backup
          path: |
            android/app/fcbaz-release.jks
            signing-key-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: FCBaz v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
