name: FCBaz Flutter Android CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org ir.fcbaz --project-name fcbaz

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk FCBaz-v0.1.0-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v0.1.0-preview
          path: FCBaz-v0.1.0-preview.apk
          if-no-files-found: error
