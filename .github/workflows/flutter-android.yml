name: FCBaz Android Final Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  RELEASE_VERSION: "1.0.3"
  # Optional backend; empty string keeps the public free-data path in the app.
  FCBAZ_API_BASE_URL: ""

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${{ env.RELEASE_VERSION }}" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org ir.fcbaz --project-name fcbaz

      - name: Set Android identity
        shell: bash
        run: |
          sed -i 's/applicationId = "ir.fcbaz.fcbaz"/applicationId = "ir.fcbaz.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = "ir.fcbaz.fcbaz"/namespace = "ir.fcbaz.app"/' android/app/build.gradle.kts || true
          sed -i 's/android:label="fcbaz"/android:label="FCBaz"/' android/app/src/main/AndroidManifest.xml

          # Keep MainActivity package aligned with applicationId/namespace.
          mkdir -p android/app/src/main/kotlin/ir/fcbaz/app
          cat > android/app/src/main/kotlin/ir/fcbaz/app/MainActivity.kt <<'EOF'
          package ir.fcbaz.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          rm -rf android/app/src/main/kotlin/ir/fcbaz/fcbaz

          if ! grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

      - name: Restore persistent release signing material
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signing-restore
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("signing-backup")) | select(.expired==false) | .id' \
            | head -n 1)

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "No previous signing-backup artifact found."
            exit 1
          fi

          echo "Using signing artifact id=${ARTIFACT_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/signing-restore/signing.zip
          unzip -o /tmp/signing-restore/signing.zip -d /tmp/signing-restore

          JKS=$(find /tmp/signing-restore -name 'fcbaz-release.jks' | head -n 1)
          INFO=$(find /tmp/signing-restore -name 'signing-key-info.txt' | head -n 1)
          if [ -z "$JKS" ] || [ -z "$INFO" ]; then
            echo "Signing files missing from artifact"
            exit 1
          fi

          cp "$JKS" android/app/fcbaz-release.jks
          cp "$INFO" signing-key-info.txt

          STORE_PASSWORD=$(awk -F= '/^storePassword=/{print $2}' signing-key-info.txt)
          KEY_PASSWORD=$(awk -F= '/^keyPassword=/{print $2}' signing-key-info.txt)
          KEY_ALIAS=$(awk -F= '/^keyAlias=/{print $2}' signing-key-info.txt)

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fcbaz-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s

          if 'val keystoreProperties = Properties()' not in s:
              anchor = 'android {'
              setup = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
              s = s.replace(anchor, setup + anchor, 1)

          if 'create("release")' not in s:
              signing_anchor = 'buildTypes {'
              signing = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              '''
              s = s.replace(signing_anchor, signing + signing_anchor, 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          p.write_text(s)
          PY

      - name: Set release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ["RELEASE_VERSION"]
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "1")
          p = Path("pubspec.yaml")
          lines = p.read_text().splitlines()
          out = []
          changed = False
          for line in lines:
              if line.startswith("version:"):
                  out.append(f"version: {version}+{run_number}")
                  changed = True
              else:
                  out.append(line)
          if not changed:
              raise SystemExit("pubspec version field not found")
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon from branded asset
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: >
          flutter build apk --release
          --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }}
          --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Build signed release AAB
        run: >
          flutter build appbundle --release
          --dart-define=FCBAZ_API_BASE_URL=${{ env.FCBAZ_API_BASE_URL }}
          --dart-define=FCBAZ_APP_VERSION=${{ env.RELEASE_VERSION }}

      - name: Prepare release files
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "FCBaz-v${RELEASE_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "FCBaz-v${RELEASE_VERSION}.aab"
          sha256sum "FCBaz-v${RELEASE_VERSION}.apk" "FCBaz-v${RELEASE_VERSION}.aab" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          ## FCBaz v${RELEASE_VERSION}

          انتشار رسمی فارسی شبیه FUTBIN با دیتای رایگان واقعی.

          - لوگوی رسمی FCBaz به‌عنوان آیکون اپ
          - دیتابیس آفلاین واقعی بازیکنان (~۱۸ هزار کارت)
          - بدون ثبت‌نام اجباری
          - بدون جایگزین‌کردن داده ساختگی به‌جای قیمت/کارت
          - امضای اندروید همان هویت نسخهٔ ۱.۰.۱ (آپدیت روی نصب قبلی ممکن است)
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-release
          path: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: Upload signing backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCBaz-v${{ env.RELEASE_VERSION }}-signing-backup
          path: |
            android/app/fcbaz-release.jks
            signing-key-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: FCBaz v${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            FCBaz-v${{ env.RELEASE_VERSION }}.apk
            FCBaz-v${{ env.RELEASE_VERSION }}.aab
            SHA256SUMS.txt
