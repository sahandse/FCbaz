name: FCBaz UI Hotfix Patch

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v1.8.1-card-layout-polish
    paths:
      - '.release/ui-hotfix-patch'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.8.1-card-layout-polish
      - name: Patch squad pitch and app theme
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          squad = Path('lib/features/squad/squad_screen.dart')
          s = squad.read_text()
          start = s.index('class _Pitch extends StatelessWidget {')
          end = s.index('class _PlayerPicker extends StatefulWidget {')
          replacement = r'''class _Pitch extends StatelessWidget {
  const _Pitch({
    required this.formation,
    required this.playersBySlot,
    required this.playerConfigs,
    required this.chemistryBySlot,
    required this.onTapEmptySlot,
    required this.onConfigurePlayer,
    required this.onRemovePlayer,
  });

  final FormationDefinition formation;
  final Map<String, Player> playersBySlot;
  final Map<String, SquadPlayerConfig> playerConfigs;
  final Map<String, int> chemistryBySlot;
  final ValueChanged<FormationSlot> onTapEmptySlot;
  final void Function(FormationSlot slot, Player player) onConfigurePlayer;
  final ValueChanged<String> onRemovePlayer;

  @override
  Widget build(BuildContext context) {
    final primary = Theme.of(context).colorScheme.primary;
    return AspectRatio(
      aspectRatio: .72,
      child: LayoutBuilder(
        builder: (context, constraints) {
          final slotWidth = (constraints.maxWidth * .175).clamp(56.0, 72.0);
          final slotHeight = slotWidth * 1.28;
          return Container(
            clipBehavior: Clip.antiAlias,
            decoration: BoxDecoration(
              borderRadius: BorderRadius.circular(24),
              border: Border.all(color: primary.withValues(alpha: .28)),
              gradient: const LinearGradient(
                begin: Alignment.topCenter,
                end: Alignment.bottomCenter,
                colors: [Color(0xFF102A18), Color(0xFF07150D), Color(0xFF030806)],
              ),
              boxShadow: [
                BoxShadow(
                  color: primary.withValues(alpha: .08),
                  blurRadius: 28,
                  spreadRadius: -10,
                  offset: const Offset(0, 16),
                ),
              ],
            ),
            child: Stack(
              children: [
                const Positioned.fill(child: _PitchLines()),
                Positioned(
                  top: 10,
                  left: 12,
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                    decoration: BoxDecoration(
                      color: Colors.black.withValues(alpha: .28),
                      borderRadius: BorderRadius.circular(7),
                      border: Border.all(color: Colors.white.withValues(alpha: .08)),
                    ),
                    child: Text(
                      'FC27 • ${formation.name}',
                      textDirection: TextDirection.ltr,
                      style: TextStyle(
                        color: primary,
                        fontSize: 9,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                  ),
                ),
                for (final slot in formation.slots)
                  Positioned(
                    left: (constraints.maxWidth * slot.x - slotWidth / 2)
                        .clamp(5.0, constraints.maxWidth - slotWidth - 5),
                    top: (constraints.maxHeight * slot.y - slotHeight / 2)
                        .clamp(24.0, constraints.maxHeight - slotHeight - 7),
                    width: slotWidth,
                    height: slotHeight,
                    child: _SlotCard(
                      slot: slot,
                      player: playersBySlot[slot.id],
                      chemistry: chemistryBySlot[slot.id] ?? 0,
                      config: playerConfigs[slot.id],
                      onTap: () {
                        final player = playersBySlot[slot.id];
                        if (player == null) {
                          onTapEmptySlot(slot);
                        } else {
                          onConfigurePlayer(slot, player);
                        }
                      },
                      onRemove: () => onRemovePlayer(slot.id),
                    ),
                  ),
              ],
            ),
          );
        },
      ),
    );
  }
}

class _PitchLines extends StatelessWidget {
  const _PitchLines();
  @override
  Widget build(BuildContext context) => CustomPaint(painter: _PitchPainter());
}

class _PitchPainter extends CustomPainter {
  @override
  void paint(Canvas canvas, Size size) {
    final stripe = Paint()..color = Colors.white.withValues(alpha: .018);
    final stripeHeight = size.height / 10;
    for (var i = 0; i < 10; i += 2) {
      canvas.drawRect(Rect.fromLTWH(0, i * stripeHeight, size.width, stripeHeight), stripe);
    }

    final paint = Paint()
      ..color = Colors.white.withValues(alpha: .18)
      ..style = PaintingStyle.stroke
      ..strokeWidth = 1.25;
    final rect = Rect.fromLTWH(13, 13, size.width - 26, size.height - 26);
    canvas.drawRRect(RRect.fromRectAndRadius(rect, const Radius.circular(18)), paint);
    canvas.drawLine(Offset(13, size.height / 2), Offset(size.width - 13, size.height / 2), paint);
    canvas.drawCircle(Offset(size.width / 2, size.height / 2), size.width * .12, paint);
    canvas.drawCircle(Offset(size.width / 2, size.height / 2), 2.2, paint);

    final boxW = size.width * .55;
    final boxH = size.height * .16;
    canvas.drawRect(Rect.fromCenter(center: const Offset(0, 0) + Offset(size.width / 2, 13), width: boxW, height: boxH), paint);
    canvas.drawRect(Rect.fromCenter(center: Offset(size.width / 2, size.height - 13), width: boxW, height: boxH), paint);
  }

  @override
  bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
}

class _SlotCard extends StatelessWidget {
  const _SlotCard({
    required this.slot,
    required this.player,
    required this.chemistry,
    required this.config,
    required this.onTap,
    required this.onRemove,
  });

  final FormationSlot slot;
  final Player? player;
  final int chemistry;
  final SquadPlayerConfig? config;
  final VoidCallback onTap;
  final VoidCallback onRemove;

  @override
  Widget build(BuildContext context) {
    final primary = Theme.of(context).colorScheme.primary;
    final filled = player != null;
    return Material(
      color: Colors.transparent,
      child: InkWell(
        onTap: onTap,
        onLongPress: filled ? onRemove : null,
        borderRadius: BorderRadius.circular(12),
        child: Container(
          padding: const EdgeInsets.fromLTRB(4, 4, 4, 5),
          decoration: BoxDecoration(
            color: filled ? const Color(0xED0A100C) : const Color(0xB30B100D),
            borderRadius: BorderRadius.circular(12),
            border: Border.all(
              color: filled ? primary.withValues(alpha: .62) : Colors.white.withValues(alpha: .20),
            ),
            boxShadow: const [
              BoxShadow(blurRadius: 10, color: Color(0x44000000), offset: Offset(0, 5)),
            ],
          ),
          child: filled ? _filled(primary) : _empty(),
        ),
      ),
    );
  }

  Widget _empty() => Column(
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const Icon(Icons.add_rounded, color: Colors.white70, size: 20),
          const SizedBox(height: 3),
          Text(
            slot.position,
            maxLines: 1,
            style: const TextStyle(color: Colors.white, fontSize: 9, fontWeight: FontWeight.w900),
          ),
        ],
      );

  Widget _filled(Color primary) => Column(
        children: [
          Row(
            children: [
              Text(
                player!.rating > 0 ? '${player!.rating}' : '—',
                style: const TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w900),
              ),
              const Spacer(),
              Text(
                player!.position,
                textDirection: TextDirection.ltr,
                style: const TextStyle(color: Colors.white70, fontSize: 7, fontWeight: FontWeight.w900),
              ),
            ],
          ),
          Expanded(
            child: player!.imageUrl.isEmpty
                ? const Center(child: Icon(Icons.person_rounded, color: Colors.white54, size: 28))
                : Image.network(
                    player!.imageUrl,
                    fit: BoxFit.contain,
                    alignment: Alignment.bottomCenter,
                    errorBuilder: (_, __, ___) => const Center(
                      child: Icon(Icons.person_rounded, color: Colors.white54, size: 28),
                    ),
                  ),
          ),
          SizedBox(
            height: 12,
            child: FittedBox(
              fit: BoxFit.scaleDown,
              child: Text(
                player!.name,
                maxLines: 1,
                textDirection: TextDirection.ltr,
                style: const TextStyle(color: Colors.white, fontSize: 8, fontWeight: FontWeight.w900),
              ),
            ),
          ),
          if (config != null && (config!.role.isNotEmpty || config!.chemistryStyle != 'Basic'))
            Text(
              [
                if (config!.role.isNotEmpty) config!.role,
                if (config!.chemistryStyle != 'Basic') config!.chemistryStyle,
              ].join(' • '),
              maxLines: 1,
              overflow: TextOverflow.ellipsis,
              textDirection: TextDirection.ltr,
              style: const TextStyle(color: Colors.white54, fontSize: 5.5),
            ),
          const SizedBox(height: 2),
          Row(
            mainAxisAlignment: MainAxisAlignment.center,
            children: List.generate(
              3,
              (i) => Container(
                width: 5,
                height: 5,
                margin: const EdgeInsets.symmetric(horizontal: 1),
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  color: i < chemistry ? primary : Colors.white24,
                ),
              ),
            ),
          ),
        ],
      );
}

'''
          s = s[:start] + replacement + s[end:]
          squad.write_text(s)

          theme = Path('lib/src/theme/fcbaz_theme.dart')
          t = theme.read_text()
          t = t.replace('static const darkBackground = Color(0xFF050806);', 'static const darkBackground = Color(0xFF030503);')
          t = t.replace('static const darkSurface = Color(0xFF0B100D);', 'static const darkSurface = Color(0xFF080C09);')
          t = t.replace('static const darkSurfaceHigh = Color(0xFF121A15);', 'static const darkSurfaceHigh = Color(0xFF101711);')
          t = t.replace('borderRadius: BorderRadius.circular(12),', 'borderRadius: BorderRadius.circular(10),', 1)
          t = t.replace('height: 64,', 'height: 62,')
          t = t.replace('toolbarHeight: 58,', 'toolbarHeight: 56,')
          theme.write_text(t)

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text()
          p = re.sub(r'^version: .*$', 'version: 1.8.1+32', p, flags=re.M)
          pubspec.write_text(p)
          PY

          rm -f .release/ui-hotfix-patch
          rm -f .github/workflows/ui-hotfix-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/squad/squad_screen.dart lib/src/theme/fcbaz_theme.dart pubspec.yaml .release/ui-hotfix-patch .github/workflows/ui-hotfix-patch.yml
          git commit -m 'fix(ui): finish squad pitch and app-wide FC27 polish'
          git push origin HEAD:fix/v1.8.1-card-layout-polish
