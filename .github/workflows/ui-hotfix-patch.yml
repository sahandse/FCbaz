name: FCBaz UI Hotfix Patch

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v1.8.1-card-layout-polish
    paths:
      - .release/ui-hotfix-patch

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v1.8.1-card-layout-polish
      - name: Apply UI patch
        run: python3 tool/apply_ui_hotfix.py
      - name: Commit patch
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add lib/features/squad/squad_screen.dart lib/src/theme/fcbaz_theme.dart pubspec.yaml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): finish squad pitch and FC27 polish"
          git push origin HEAD:fix/v1.8.1-card-layout-polish
