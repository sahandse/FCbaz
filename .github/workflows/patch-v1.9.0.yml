name: FCBaz v1.9.0 Patch

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v1.9.0-prices-sbc
    paths:
      - '.release/patch-v1.9.0'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v1.9.0-prices-sbc
      - name: Apply SBC and version patch
        run: python3 tool/apply_sbc_price_fix.py
      - name: Commit patch
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add lib/features/sbc/presentation/sbc_screen.dart pubspec.yaml
          git diff --cached --quiet && exit 0
          git commit -m "feat(sbc): show public FC27 guidance and solution fallback"
          git push origin HEAD:fix/v1.9.0-prices-sbc
