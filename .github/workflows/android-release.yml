name: Android verification build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Regenerate missing Android platform scaffolding
        run: |
          flutter create --platforms=android .
          # flutter create adds a template widget test that targets MyApp;
          # this app has its own test suite and no MyApp entry point.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify custom Android launcher icon
        run: test -f android/app/src/main/res/drawable/fcbaz_launcher.xml

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          # sdkmanager caches truncated NDK archives when the runner download is
          # cut short ("Error on ZipFile unknown archive"); without clearing
          # .temp a retry reuses the same corrupt archive.
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "build attempt $attempt failed, clearing cached SDK downloads"
            if [ -n "$sdk" ]; then
              rm -rf "$sdk/.temp" "$sdk/ndk"
            fi
            sleep 20
          done
          exit 1

      - name: Upload verification APK artifact
        uses: actions/upload-artifact@v4
        with:
          # This build is signed with the debug key for verification only. It is
          # deliberately not published as a GitHub Release; production releases
          # are built by flutter-android.yml with the stable release keystore.
          name: fcbaz-android-verification
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
