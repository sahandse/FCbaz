name: Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Regenerate missing Android platform scaffolding
        run: |
          flutter create --platforms=android .
          # flutter create adds a template widget test that targets MyApp;
          # this app has its own test suite and no MyApp entry point.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          # sdkmanager caches truncated NDK archives when the runner download is
          # cut short ("Error on ZipFile unknown archive"); without clearing
          # .temp a retry reuses the same corrupt archive.
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "build attempt $attempt failed, clearing cached SDK downloads"
            if [ -n "$sdk" ]; then
              rm -rf "$sdk/.temp" "$sdk/ndk"
            fi
            sleep 20
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcbaz-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.3.5 >/dev/null 2>&1; then
            gh release upload v2.3.5 build/app/outputs/flutter-apk/app-release.apk --clobber
          else
            gh release create v2.3.5 build/app/outputs/flutter-apk/app-release.apk --title "FCBaz v2.3.5" --notes "FCBaz Android release v2.3.5 (build 43). Restores the FCBaz launcher icon during CI builds and includes player catalog and price merge fixes."
          fi
