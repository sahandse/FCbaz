name: Verify published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v2.6.2
        type: string
      version_code:
        description: Expected Android versionCode
        required: true
        default: '50'
        type: string
  push:
    branches:
      - main
    paths:
      - '.verify/published-release'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT_SHA256: 244aab755d0c8c45fe54d9b999aadd36f1e56bce099cd52232b64871d21a0b94
      EXPECTED_PACKAGE: ir.fcbaz.app
      EXPECTED_LABEL: FCBaz
      EXPECTED_ACTIVITY: ir.fcbaz.app.MainActivity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            code="${{ inputs.version_code }}"
          else
            tag="$(sed -n 's/^tag=//p' .verify/published-release | tr -d '\r')"
            code="$(sed -n 's/^version_code=//p' .verify/published-release | tr -d '\r')"
          fi
          test -n "$tag"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $tag"; exit 1; }
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "Invalid version_code: $code"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --clobber
          ls -la dist

      - name: Verify published checksums
        working-directory: dist
        shell: bash
        run: sha256sum -c SHA256SUMS.txt

      - name: Verify certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)"
          apk="$(find dist -name '*.apk' | head -n 1)"
          test -n "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          {
            echo "### Published APK certificate: ${TAG}"
            echo '```'
            cat apk-signature.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" apk-signature.txt; then
            actual="$(grep -m1 'certificate SHA-256 digest' apk-signature.txt || echo 'digest line missing')"
            echo "::error title=Certificate fingerprint mismatch::${actual}; expected ${EXPECTED_CERT_SHA256}"
            exit 1
          fi

      - name: Verify certificate subject and signature scheme
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qE 'certificate (DN|subject DN): .*CN=FCBaz' apk-signature.txt; then
            echo "::error title=Certificate subject mismatch::$(grep -m1 'certificate DN' apk-signature.txt || echo 'DN line missing')"
            exit 1
          fi
          if ! grep -qE 'certificate (DN|subject DN): .*O=FCBaz' apk-signature.txt; then
            echo "::error title=Certificate organization mismatch::$(grep -m1 'certificate DN' apk-signature.txt || echo 'DN line missing')"
            exit 1
          fi
          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt; then
            echo "::error title=APK Signature Scheme v2 not verified::$(grep -m1 'v2 scheme' apk-signature.txt || echo 'v2 line missing')"
            exit 1
          fi

      - name: Verify package identity and version
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)"
          apk="$(find dist -name '*.apk' | head -n 1)"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" > badging.txt
          {
            echo "### Published APK identity: ${TAG} (versionCode ${VERSION_CODE})"
            echo '```'
            printf '%s\n' "$badging" | grep -E "^(package|versionCode|versionName|application-label|application-icon|launchable-activity)" || true
            echo '```'
            echo "Published checksums:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pkg="$(printf '%s\n' "$badging" | grep -m1 '^package:')"
          for expected in \
            "name='${EXPECTED_PACKAGE}'" \
            "versionCode='${VERSION_CODE}'" \
            "versionName='${TAG#v}'"; do
            if ! printf '%s\n' "$pkg" | grep -qF "$expected"; then
              echo "::error title=Package identity mismatch::${pkg}; missing ${expected}"
              exit 1
            fi
          done
          if ! grep -qF "application-label:'${EXPECTED_LABEL}'" badging.txt; then
            echo "::error title=App label mismatch::$(grep -m1 'application-label' badging.txt || echo 'label missing')"
            exit 1
          fi
          if ! grep -qF "launchable-activity: name='${EXPECTED_ACTIVITY}'" badging.txt; then
            echo "::error title=Launchable activity mismatch::$(grep -m1 'launchable-activity' badging.txt || echo 'activity missing')"
            exit 1
          fi
          if ! grep -q "application-icon" badging.txt; then
            echo "::error title=Application icon missing::$(grep -m1 'application-icon' badging.txt || echo 'icon entry missing')"
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-release-verification
          path: |
            apk-signature.txt
            badging.txt
          if-no-files-found: ignore
          retention-days: 30
