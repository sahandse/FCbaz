name: Import FCBaz project

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.import/READY'
  workflow_dispatch:

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/READY
          cat .import/part*.b64 | base64 -d > /tmp/FCbaz.zip
          rm -rf /tmp/fcbaz-import
          mkdir -p /tmp/fcbaz-import
          unzip -q /tmp/FCbaz.zip -d /tmp/fcbaz-import
          test -d /tmp/fcbaz-import/FCbaz

      - name: Import files into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          shopt -s dotglob nullglob
          cp -a /tmp/fcbaz-import/FCbaz/* .
          rm -f .github/workflows/import-fcbaz.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import: upload FCBaz project from provided archive"
          git push origin HEAD:main
